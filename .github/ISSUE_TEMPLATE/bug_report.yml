name: Bug report
description: Something on the site looks or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 18 on iPhone 15
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
